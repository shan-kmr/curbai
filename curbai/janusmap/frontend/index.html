<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html,body{margin:0;padding:0;background:#F6F4EF;overflow:hidden;}
  #map{position:absolute;inset:0;}
  #hud{position:absolute;left:10px;bottom:10px;z-index:9;
       font:600 10px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.08em;
       color:#8C887E;background:rgba(246,244,239,.85);padding:4px 8px;
       border:1px solid #E0DDD4;border-radius:4px;pointer-events:none;
       text-transform:uppercase;}
  #tip{position:absolute;z-index:10;pointer-events:none;display:none;
       font:12px/1.45 ui-monospace,Menlo,monospace;color:#1A1815;
       background:#F6F4EF;border:1px solid #E0DDD4;border-radius:4px;
       padding:7px 10px;max-width:240px;box-shadow:0 2px 8px rgba(26,24,21,.08);}
  #tip b{color:#1E3A8A;}
</style>
<script src="https://unpkg.com/h3-js@3.7.2/dist/h3-js.umd.js"></script>
<script src="https://unpkg.com/deck.gl@8.9.36/dist.min.js"></script>
</head>
<body>
<div id="map"></div>
<div id="hud">res 5</div>
<div id="tip"></div>
<script>
/* ---------- Streamlit component protocol (hand-rolled) ---------- */
function toStreamlit(type, data){ window.parent.postMessage(Object.assign({isStreamlitMessage:true, type}, data), "*"); }
function setValue(v){ toStreamlit("streamlit:setComponentValue", {value:v, dataType:"json"}); }

/* ---------- constants ---------- */
const COBALT=[30,58,138], PAPER=[246,244,239], LINE=[30,58,138];
const LADDER=[[5,0],[6,5.8],[7,7.3],[8,8.8],[9,10.3]];   // [res, minZoom]
const BUILDING_ZOOM=14.2;
const RAMP=[[0.0,[223,221,212]],[0.35,[170,182,205]],[0.70,[70,105,180]],[1.0,[30,58,138]]];
function ramp(t){ t=Math.max(0,Math.min(1,t));
  for(let i=0;i<RAMP.length-1;i++){const[a,ca]=RAMP[i],[b,cb]=RAMP[i+1];
    if(t>=a&&t<=b){const f=(t-a)/(b-a+1e-9);
      return [0,1,2].map(k=>ca[k]+f*(cb[k]-ca[k]));}}
  return COBALT; }
function mulberry32(seed){ return function(){ let t=seed+=0x6D2B79F5;
  t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61);
  return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }

/* ---------- state ---------- */
let deckgl=null, args=null, inited=false;
let store={};                 // res -> Map(h3 -> row {v, bc, fl, mh})
let centers={};               // res5 centers for viewport→parent mapping
let requested=new Set();      // "res:parent" already asked for
let view={latitude:39.5, longitude:-98.0, zoom:3.6, pitch:42, bearing:-14};
let needTimer=null, lastSel=null, viewInit=false;
const tip=document.getElementById("tip"), hud=document.getElementById("hud");

function activeRes(z){ let r=5; for(const[res,mz] of LADDER) if(z>=mz) r=res; return r; }

/* ---------- ingest args ---------- */
function ingest(a){
  args=a;
  if(a.view0 && !viewInit){ viewInit=true; view={...view, ...a.view0};
    if(deckgl) deckgl.setProps({initialViewState:{...view}}); }
  // res-5 baseline (columnar)
  if(a.r5 && !store["5"]){
    store["5"]=new Map(); centers=[];
    const {h3,lat,lon,val}=a.r5;
    for(let i=0;i<h3.length;i++){
      store["5"].set(h3[i], {v: val? val[i]:null});
      centers.push([h3[i], lat[i], lon[i]]);
    }
  } else if(a.r5 && a.r5.val && store["5"]){       // layer switch: refresh values
    const {h3,val}=a.r5;
    for(let i=0;i<h3.length;i++){ const r=store["5"].get(h3[i]); if(r) r.v=val[i]; }
  }
  // chunks {res:{parent:{h3,val,bc,fl,mh}}}
  for(const res in (a.chunks||{})){
    if(!store[res]) store[res]=new Map();
    const byParent=a.chunks[res];
    for(const parent in byParent){
      const c=byParent[parent];
      for(let i=0;i<c.h3.length;i++){
        store[res].set(c.h3[i], {v:c.val?c.val[i]:null,
          bc:c.bc?c.bc[i]:0, fl:c.fl?c.fl[i]:0, mh:c.mh?c.mh[i]:0});
      }
      requested.add(res+":"+parent);
    }
  }
  redraw();
}

/* ---------- viewport → needed parents ---------- */
function visibleParents(){
  if(!deckgl||!centers.length) return [];
  const vp=deckgl.getViewports?deckgl.getViewports()[0]:null; if(!vp) return [];
  const [w,s]=vp.unproject([0,vp.height]), [e,n]=vp.unproject([vp.width,0]);
  const padLon=(e-w)*0.25, padLat=(n-s)*0.25, out=[];
  for(const[id,la,lo] of centers)
    if(lo>w-padLon&&lo<e+padLon&&la>s-padLat&&la<n+padLat) out.push(id);
  const CAP={6:140,7:120,8:48,9:10};
  return out.slice(0, CAP[activeRes(view.zoom)]||60);
}
function maybeNeed(){
  const res=activeRes(view.zoom);
  hud.textContent="res "+res+(view.zoom>=BUILDING_ZOOM?" · buildings":"");
  if(res===5) return;
  const missing=visibleParents().filter(p=>!requested.has(res+":"+p));
  if(!missing.length) return;
  clearTimeout(needTimer);
  needTimer=setTimeout(()=>{
    missing.forEach(p=>requested.add(res+":"+p));
    setValue({t:"need", res:res, parents:missing, nonce:Date.now()});
  }, 280);
}

/* ---------- procedural buildings ---------- */
function buildingsFor(rows){
  const polys=[];
  for(const [id,row] of rows){
    const n=Math.min(row.bc||0, 26); if(!n) continue;
    const rnd=mulberry32(hashStr(id));
    // hex boundary center approx: use first center from picking store? we lack
    // per-cell centers at r9 client-side; derive from deck's h3 utils:
    const c=h3.h3ToGeo(id);
    if(!c) continue;
    const [clat,clon]=c;
    const mPerDegLat=111320, mPerDegLon=111320*Math.cos(clat*Math.PI/180);
    for(let i=0;i<n;i++){
      const ang=rnd()*Math.PI*2, dist=Math.sqrt(rnd())*148; // uniform over the cell disk
      const bx=clon+Math.cos(ang)*dist/mPerDegLon;
      const by=clat+Math.sin(ang)*dist/mPerDegLat;
      const half=(5+rnd()*6);                              // 10–22 m footprint
      const hx=half/mPerDegLon, hy=half/mPerDegLat;
      const rot=rnd()*Math.PI, cs=Math.cos(rot), sn=Math.sin(rot);
      const pts=[[-hx,-hy],[hx,-hy],[hx,hy],[-hx,hy]].map(([x,y])=>
        [bx + x*cs - y*sn, by + x*sn + y*cs]);
      const floors=Math.max(1, (row.fl||2)*(0.5+rnd()));
      const h=Math.min(3.2*floors, row.mh>3?row.mh:60);
      polys.push({polygon:pts, h});
    }
  }
  return polys;
}

/* ---------- layers ---------- */
function hexLayer(res, rows, isTop){
  const structure = !(args && args.layer && args.layer.col);
  const vmax = args && args.layer && args.layer.vmax ? (args.layer.vmax[String(res)]||1) : 1;
  const data=[...rows.entries()].map(([id,r])=>({id, v:r.v}));
  return new deck.H3HexagonLayer({
    id:"hex-r"+res, data,
    getHexagon:d=>d.id,
    filled:true, extruded:false, stroked:true,
    getFillColor:d=>{
      if(structure||d.v==null) return [30,58,138, isTop?10:4];
      const t=Math.log1p(Math.max(0,d.v))/Math.log1p(vmax||1);
      return [...ramp(t), 26+t*150];
    },
    getLineColor:[...LINE, isTop?70:26],
    lineWidthMinPixels: isTop?1:0.5,
    pickable:isTop, autoHighlight:isTop,
    highlightColor:[30,58,138,50],
    transitions:{getFillColor:350, getLineColor:350},
    updateTriggers:{getFillColor:[structure, vmax, args&&args.layer&&args.layer.col]},
  });
}

function redraw(){
  if(!deckgl) return;
  const z=view.zoom, res=activeRes(z), layers=[];
  layers.push(new deck.TileLayer({
    id:"base", data:"https://basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png",
    minZoom:0, maxZoom:19, tileSize:256, opacity:0.9,
    renderSubLayers:p=>{const{west,south,east,north}=p.tile.bbox;
      return new deck.BitmapLayer(p,{data:null,image:p.data,bounds:[west,south,east,north]});},
  }));
  // parent res faint underlay (context while children load)
  const order=[5,6,7,8,9].filter(r=>r<=res && store[String(r)] && store[String(r)].size);
  for(const r of order){
    layers.push(hexLayer(r, store[String(r)], r===res || (r===Math.max(...order)&&r<res)));
  }
  if(z>=BUILDING_ZOOM && store["9"]){
    // buildings only for cells near viewport: sample all r9 (cheap enough per chunk cap)
    layers.push(new deck.SolidPolygonLayer({
      id:"bldg", data:buildingsFor(store["9"]),
      getPolygon:d=>d.polygon, extruded:true, getElevation:d=>d.h,
      getFillColor:[226,222,211,235], getLineColor:[30,58,138,40],
      material:{ambient:0.45,diffuse:0.55,shininess:24,specularColor:[80,90,120]},
    }));
  }
  if(args && args.focus && store["9"] && store["9"].has(args.focus)){
    layers.push(new deck.H3HexagonLayer({id:"focus", data:[{id:args.focus}],
      getHexagon:d=>d.id, filled:true, stroked:true, extruded:false,
      getFillColor:[30,58,138,60], getLineColor:[...PAPER,255],
      lineWidthMinPixels:2.5, pickable:false}));
  }
  deckgl.setProps({layers});
}

/* ---------- interactions ---------- */
function onClick(info){
  if(!info || !info.object) return;
  const id=info.object.id, res=activeRes(view.zoom);
  if(res>=9){
    lastSel=id;
    setValue({t:"select", h3:id, nonce:Date.now()});
    redraw();
    return;
  }
  // fly INTO the tile → next ladder step (the split happens on arrival)
  const next=LADDER.find(([r])=>r===Math.min(res+1,9));
  const c=h3.h3ToGeo(id);
  if(!c) return;
  view={...view, latitude:c[0], longitude:c[1],
        zoom:(next?next[1]:11)+0.55,
        transitionDuration:900,
        transitionInterpolator:new deck.FlyToInterpolator({curve:1.4})};
  deckgl.setProps({initialViewState:{...view}});
}
function onHover(info){
  if(info && info.object && args && args.layer && args.layer.col && info.object.v!=null){
    tip.style.display="block";
    tip.style.left=(info.x+14)+"px"; tip.style.top=(info.y+14)+"px";
    const f=args.layer.fmt||"%v";
    tip.innerHTML="<b>"+Number(info.object.v).toLocaleString(undefined,{maximumFractionDigits:2})+
      "</b> "+(args.layer.label||"")+"<br/>click to open";
  } else tip.style.display="none";
}

/* ---------- boot ---------- */
function boot(){
  deckgl=new deck.DeckGL({
    container:"map", controller:{inertia:260},
    initialViewState:view,
    onViewStateChange:({viewState})=>{ view=viewState; maybeNeed();
      hud.textContent="res "+activeRes(view.zoom)+(view.zoom>=BUILDING_ZOOM?" · buildings":""); },
    onClick:onClick, onHover:onHover,
    getCursor:({isHovering})=>isHovering?"pointer":"grab",
  });
  inited=true;
}
window.addEventListener("message", ev=>{
  const m=ev.data;
  if(!m || m.type!=="streamlit:render") return;
  if(!inited) boot();
  ingest(m.args);
  toStreamlit("streamlit:setFrameHeight", {height: m.args.height||580});
});
window.onerror=(m,src,l)=>{hud.textContent=("ERR "+m+" @"+l).slice(0,160); hud.style.color="#B04A3A";};
toStreamlit("streamlit:componentReady", {apiVersion:1});
if(window.__DBG_ARGS){ try{ boot(); ingest(window.__DBG_ARGS); }catch(e){ hud.textContent="ERR "+e.message; } }
toStreamlit("streamlit:setFrameHeight", {height: 580});
</script>
</body>
</html>
